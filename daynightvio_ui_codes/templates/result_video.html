{% extends "base.html" %}
{% block content %}
<p class="subtitle">Processed with {{ model_name }} model. Video processing completed.</p>

<div class="result-stats">
    <span class="stat helmetless">Helmetless riders: {{ helmetless }}</span>
    <span class="stat overloaded">Overloaded bikes: {{ overloaded }}</span>
</div>

<div class="result-video">
    <video controls src="{{ url_for('output_file', filename=video_filename) }}"></video>
</div>

<p><a href="{{ url_for('index') }}" class="btn">Process another</a></p>
{% endblock %}

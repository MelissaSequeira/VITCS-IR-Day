{% extends "base.html" %}
{% block content %}
<p class="subtitle">Processed with {{ model_name }} model.</p>

<div class="result-stats">
    <span class="stat helmetless">Helmetless riders: {{ helmetless }}</span>
    <span class="stat overloaded">Overloaded bikes: {{ overloaded }}</span>
</div>

<div class="result-image">
    <img src="data:image/jpeg;base64,{{ image_b64 }}" alt="Processed result">
</div>

<p><a href="{{ url_for('index') }}" class="btn">Process another</a></p>
{% endblock %}

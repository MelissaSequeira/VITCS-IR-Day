<!DOCTYPE html>
<html>
<head>
    <title>OCR Results</title>
    <style>
        table { border-collapse: collapse; width: 95%; margin: auto; }
        th, td { border: 1px solid black; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        img { width: 120px; }
    </style>
</head>
<body>

<h2 style="text-align:center;">OCR & Violation Records</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Violation Image</th>
        <th>Detected Plate</th>
        <th>Violation Type</th>
        <th>Date</th>
        <th>Time</th>
    </tr>

    {% for row in data %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>
            <img src="{{ url_for('static', filename='violations/' + row[1]) }}">
        </td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
        <td>{{ row[5] }}</td>
        <td>{{ row[6] }}</td>
    </tr>
    {% endfor %}

</table>

<br><br>
<center>
<a href="/">⬅ Back to Home</a>
</center>

</body>
</html>

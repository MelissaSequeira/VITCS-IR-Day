<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VITCS – IISER Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
      rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .btn-custom {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card bg-dark text-white p-4 text-center">
            <h1 class="mb-3">Vehicle Identification & Traffic Compliance System</h1>
            <p class="text-secondary mb-4">
                Integrated Helmet Violation Detection & Number Plate OCR
            </p>

            <div class="row g-3">
                <div class="col-md-6">
                    <a href="{{ url_for('violation_page') }}" 
                       class="btn btn-danger btn-custom">
                        🚨 Helmet & Overloading Violation
                    </a>
                </div>
                <div class="col-md-6">
                    <a href="{{ url_for('ocr_page') }}" 
                       class="btn btn-primary btn-custom">
                        🔍 Number Plate OCR
                    </a>
                </div>
            </div>

            <hr class="my-4">

            <p class="small text-secondary">
                VITCS – IISER Collaborative Project
            </p>
        </div>
    </div>
</body>
</html>

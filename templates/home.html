<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Traffic System - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #050814;
            --bg-card: #0b1120;
            --border-blue: rgba(56, 189, 248, 0.2);
            --neon-blue: #38bdf8;
            --neon-purple: #c084fc;
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e3a8a 0%, transparent 40%);
        }

        .home-card {
            background: var(--bg-card);
            border: 1px solid var(--border-blue);
            border-radius: 15px;
            padding: 50px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-custom {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            border: none;
            transition: 0.3s;
        }

        .btn-violation {
            background: linear-gradient(45deg, #7e22ce, #c084fc);
            box-shadow: 0 4px 20px rgba(192, 132, 252, 0.4);
            color: white;
        }

        .btn-dashboard {
            background: linear-gradient(45deg, #0284c7, #38bdf8);
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
            color: white;
        }

        .btn-custom:hover {
            transform: translateY(-3px);
        }

        .icon {
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div class="home-card">
        <h1><i class="fa-solid fa-microchip"></i> AI Traffic System</h1>

        <!-- Violation Button -->
        <a href="/violation">
            <button class="btn-custom btn-violation">
                <i class="fa-solid fa-triangle-exclamation icon"></i>
                Violation Detection
            </button>
        </a>

        <!-- Dashboard Button -->
        <a href="/dashboard">
            <button class="btn-custom btn-dashboard">
                <i class="fa-solid fa-database icon"></i>
                Open Dashboard
            </button>
        </a>

    </div>

</body>
</html>

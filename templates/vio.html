<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Violation Detection</title>
    <style>
        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            color: #111;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        label {
            font-weight: bold;
            margin-right: 15px;
        }

        input[type="file"],
        input[type="number"] {
            padding: 8px;
            margin-top: 10px;
        }

        .row {
            margin-bottom: 15px;
        }

        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        hr {
            margin: 30px 0;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            text-align: center;
            background: #fff;
        }

        .card img {
            width: 100%;
            border-radius: 4px;
        }

        .tag {
            margin-top: 6px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚦 Traffic Violation Detection</h1>

    <!-- ================= FORM ================= -->
    <form method="POST" enctype="multipart/form-data">
        <div class="row">
            <label>
                <input type="radio" name="mode" value="image" checked>
                Image
            </label>
            <label>
                <input type="radio" name="mode" value="video">
                Video
            </label>
        </div>

        <div class="row">
            <label>
                <input type="radio" name="time" value="day" checked>
                Day
            </label>
            <label>
                <input type="radio" name="time" value="night">
                Night
            </label>
        </div>

        <div class="row">
            <label>Confidence:</label>
            <input type="number" step="0.01" name="conf" value="0.25">
        </div>

        <div class="row">
            <input type="file" name="file" required>
        </div>

        <button type="submit">Detect Violation</button>
    </form>

    <!-- ================= VIDEO STREAM ================= -->
    <hr>
    <h2>Live Video Detection</h2>
    <p>Select <b>Video + Day/Night</b> and upload a video, then open stream:</p>

    <div class="row">
        <a href="/video_feed/day" target="_blank">
            <button>▶ Day Stream</button>
        </a>
        <a href="/video_feed/night" target="_blank">
            <button>🌙 Night Stream</button>
        </a>
    </div>

    <!-- ================= VIOLATIONS ================= -->
    <hr>
    <h2>Detected Violations</h2>

    {% if violation_images %}
    <div class="gallery">
        {% for img in violation_images %}
<div class="card">
    <img src="{{ url_for('static', filename='violations/' + img) }}">
    <div class="tag">{{ img }}</div>

    <!-- ✅ OCR BUTTON (CORRECT PLACE) -->
    <a href="{{ url_for('do_ocr', img=img) }}">
        <button style="margin-top:8px;">🔍 Run OCR</button>
    </a>
</div>
{% endfor %}

    </div>
    {% else %}
        <p>No violations detected yet.</p>
    {% endif %}
    
</div>

</body>
</html>

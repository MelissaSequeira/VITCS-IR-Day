<!-- templates/results.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="mb-4">Detected Plates</h1>
      <a class="btn btn-secondary mb-3" href="{{ url_for('index') }}">Upload another</a>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Filename</th>
            <th>Source</th>
            <th>Detected Text</th>
            <th>Confidence</th>
            <th>Frame Time (s)</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody>
        {% for r in rows %}
          <tr>
            <td>{{ r[0] }}</td>
            <td><a target="_blank" href="{{ url_for('uploaded_file', filename=r[1]) }}">{{ r[1] }}</a></td>
            <td>{{ r[2] }}</td>
            <td>{{ r[3] }}</td>
            <td>{{ '%.2f'|format(r[4] or 0) }}</td>
            <td>{{ '%.2f'|format(r[5] or 0) if r[5] else '' }}</td>
            <td>{{ r[6] }}</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
